<!DOCTYPE html>

<html>
<head>
<title>Captune Cart Premium Cart</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

.header{
background:#111;
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #333;
}

.logo{
font-size:32px;
font-weight:bold;
color:#D4AF37;
}

.container{
max-width:1200px;
margin:40px auto;
display:flex;
gap:30px;
padding:20px;
}

.cart{
flex:2;
background:#1a1a1a;
border-radius:20px;
padding:25px;
}

.item{
display:flex;
align-items:center;
gap:20px;
padding:20px 0;
border-bottom:1px solid #333;
}

.item img{
width:140px;
height:140px;
border-radius:15px;
}

.item-details h2{
margin-bottom:10px;
}

.price{
color:#D4AF37;
font-size:24px;
font-weight:bold;
}

.summary{
flex:1;
background:#1a1a1a;
border-radius:20px;
padding:25px;
height:fit-content;
}

.summary h2{
margin-bottom:20px;
color:#D4AF37;
}

.row{
display:flex;
justify-content:space-between;
margin:15px 0;
}

.total{
font-size:24px;
font-weight:bold;
color:#D4AF37;
}

.btn{
width:100%;
padding:15px;
margin-top:20px;
background:#D4AF37;
color:black;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="header">
<div class="logo">🛒 Captune Cart</div>
<div>Premium Shopping Experience</div>
</div>

<div class="container">

<div class="cart">

<div class="item">
<img src="https://picsum.photos/200/200?1">

<div class="item-details">
<h2>Smart Watch Pro</h2>
<div class="price">₹2,999</div>
<p>Premium Fitness Smart Watch</p>
</div>
</div>

<div class="item">
<img src="https://picsum.photos/200/200?2">

<div class="item-details">
<h2>Wireless Headphones</h2>
<div class="price">₹1,999</div>
<p>Noise Cancelling Audio</p>
</div>
</div>

</div>

<div class="summary">

<h2>Order Summary</h2>

<div class="row">
<span>Items Total</span>
<span>₹4,998</span>
</div>

<div class="row">
<span>Delivery</span>
<span>FREE</span>
</div>

<div class="row">
<span>Discount</span>
<span>-₹500</span>
</div>

<hr>

<div class="row total">
<span>Total</span>
<span>₹4,498</span>
</div>

<button class="btn">
PLACE ORDER
</button>

</div>

</div>

</body>
</html>
