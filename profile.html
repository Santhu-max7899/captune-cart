<!DOCTYPE html>
<html>
<head>
<title>Premium Profile</title><nav class="navbar">
    <div class="logo">SHOPX</div>

    <div class="search-box">
        <input type="text" placeholder="Search products...">
    </div>

    <div class="nav-icons">
        <span>❤️</span>
        <span>🛒</span>
        <span>👤</span>
    </div>
</nav>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#141e30,#243b55);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.profile-card{
    width:350px;
    text-align:center;
    padding:30px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    animation:fadeIn 1.5s ease;
}
.navbar{
    height:70px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    box-shadow:0 2px 15px rgba(0,0,0,0.1);
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#ff3f6c;
}

.search-box input{
    width:500px;
    padding:12px;
    border:none;
    background:#f5f5f5;
    border-radius:10px;
}

.nav-icons span{
    font-size:24px;
    margin-left:20px;
    cursor:pointer;
}
.profile-img{
    width:170px;
    height:170px;
    border-radius:50%;
    border:5px solid gold;
    object-fit:cover;
    animation:float 3s ease-in-out infinite;
}

.vip{
    background:gold;
    color:black;
    display:inline-block;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    margin-top:10px;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
}

.box{
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    width:90px;
    transition:0.4s;
}

.box:hover{
    transform:translateY(-10px);
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
    100%{transform:translateY(0);}
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>

<body>

<div class="profile-card">

<img src="https://i.pravatar.cc/300" class="profile-img">

<h1>Santhu Kumar</h1>

<div class="vip">👑 VIP MEMBER</div>

<div class="stats">

<div class="box">
<h2>25</h2>
<p>Orders</p>
</div>

<div class="box">
<h2>12</h2>
<p>Wish</p>
</div>

<div class="box">
<h2>2450</h2>
<p>Points</p>
</div>

</div>

</div>

</body>
</html>
