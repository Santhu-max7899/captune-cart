<!DOCTYPE html>
<html>
<head>
<title>Captune Cart Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#000000,#1a1a1a,#333333);
}

.login-box{
    width:420px;
    background:#111;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,215,0,0.5);
    text-align:center;
}

.logo{
    color:#FFD700;
    font-size:38px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    color:#ccc;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:1px solid #FFD700;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#aaa;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#FFD700;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#FFC000;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.links a{
    color:#FFD700;
    text-decoration:none;
}

.signup{
    margin-top:25px;
    color:white;
}

.signup a{
    color:#FFD700;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">👑 Captune Cart</div>

    <div class="subtitle">
        Welcome Back
    </div>

    <input type="email" placeholder="📧 Enter Email">

    <input type="password" placeholder="🔒 Enter Password">

    <button>LOGIN</button>

    <div class="links">
        <a href="#">Forgot Password?</a>
        <a href="#">Help</a>
    </div>

    <div class="signup">
        New User?
        <a href="#">Create Account</a>
    </div>

</div>

</body>
</html>
