<!DOCTYPE html>
<html>
<head>
    <title>Captune Cart Profile</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f5f5f6;
        }

        .banner{
            background:linear-gradient(135deg,#ff3f6c,#ff6f91);
            color:white;
            text-align:center;
            padding:40px;
        }

        .profile{
            background:white;
            width:90%;
            max-width:1000px;
            margin:20px auto;
            padding:30px;
            border-radius:15px;
        }

        .profile-top{
            display:flex;
            align-items:center;
            gap:25px;
        }

        .profile img{
            width:130px;
            height:130px;
            border-radius:50%;
            border:4px solid #ff3f6c;
        }
    </style>
</head>

<body>

<div class="banner">
    <h2>Welcome Back, Santhu 👋</h2>
    <p>Enjoy Premium Shopping Experience</p>
</div>

<div class="profile">
    <div class="profile-top">
        <img src="https://i.pravatar.cc/200">

        <div>
            <h1>Santhu Kumar ✓</h1>
            <p>👑 Premium Member</p>
            <p>santhu@gmail.com</p>
        </div>
    </div>
</div>

</body>
</html>
