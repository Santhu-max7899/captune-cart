
<!DOCTYPE html>
<html>
<head>
<title>Captune Cart - Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f5f5f5;
}

.header{
    background:linear-gradient(135deg,#ff3f6c,#ff6b81);
    color:white;
    text-align:center;
    padding:40px 20px;
}

.profile-pic{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid white;
}

.name{
    margin-top:15px;
    font-size:28px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    margin-top:10px;
    background:gold;
    color:black;
    padding:8px 20px;
    border-radius:30px;
    font-weight:bold;
}

.search-bar{
    width:80%;
    max-width:700px;
    margin:20px auto;
    display:flex;
    background:white;
    border-radius:50px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.search-bar input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    font-size:16px;
}

.search-bar button{
    background:#ff3f6c;
    color:white;
    border:none;
    padding:15px 25px;
    cursor:pointer;
}

.stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:30px;
    flex-wrap:wrap;
}

.card{
    background:white;
    width:220px;
    padding:25px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h2{
    color:#ff3f6c;
}

.menu{
    width:90%;
    max-width:800px;
    margin:20px auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.menu-item{
    padding:18px 20px;
    border-bottom:1px solid #eee;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.menu-item:hover{
    background:#ff3f6c;
    color:white;
    padding-left:35px;
}
</style>
</head>

<body>

<div class="header">
    <img src="https://i.pravatar.cc/150" class="profile-pic">
    <div class="name">Santhu Kumar ✓</div>
    <div class="badge">👑 Premium Member</div>
</div>

<div class="search-bar">
    <input type="text" placeholder="Search orders, products, brands...">
    <button>🔍</button>
</div>

<div class="stats">
    <div class="card">
        <h2>25</h2>
        <p>Orders</p>
    </div>

    <div class="card">
        <h2>12</h2>
        <p>Wishlist</p>
    </div>

    <div class="card">
        <h2>₹1500</h2>
        <p>Rewards</p>
    </div>
</div>

<div class="menu">
    <div class="menu-item">📦 My Orders</div>
    <div class="menu-item">❤️ Wishlist</div>
    <div class="menu-item">💳 Payments</div>
    <div class="menu-item">📍 Saved Addresses</div>
    <div class="menu-item">🎁 Coupons & Rewards</div>
    <div class="menu-item">⭐ Premium Membership</div>
    <div class="menu-item">🔔 Notifications</div>
    <div class="menu-item">⚙️ Account Settings</div>
    <div class="menu-item">🚪 Logout</div>
</div>

</body>
</html>
