<!DOCTYPE html>
<html>
<head>
<title>Premium Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f6;
}

.header{
    background:linear-gradient(135deg,#ff3f6c,#ff6b81);
    color:white;
    padding:30px;
    text-align:center;
}

.profile-pic{
    width:100px;
    height:100px;
    border-radius:50%;
    border:4px solid white;
}

.header h2{
    margin-top:10px;
}

.badge{
    display:inline-block;
    background:gold;
    color:black;
    padding:5px 15px;
    border-radius:20px;
    margin-top:10px;
    font-weight:bold;
}

.container{
    width:90%;
    margin:auto;
    margin-top:20px;
}

.stats{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.menu{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.menu-item{
    padding:18px 20px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    font-size:17px;
    transition:.3s;
}

.menu-item:hover{
    background:#ff3f6c;
    color:white;
    padding-left:30px;
}
.search-container{
    width:80%;
    max-width:700px;
    margin:20px auto;
    display:flex;
}

.search-container input{
    flex:1;
    padding:15px;
    font-size:16px;
    border:1px solid #ddd;
    border-radius:10px 0 0 10px;
    outline:none;
}

.search-container button{
    padding:15px 25px;
    background:#ff3f6c;
    color:white;
    border:none;
    border-radius:0 10px 10px 0;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">

<img src="https://i.pravatar.cc/150" class="profile-pic">

<h2>Santhu Kumar ✓</h2>

<div class="badge">👑 Premium Member</div>

</div>

<div class="search-container">
    <input type="text" placeholder="Search for products, brands and more">
    <button>🔍</button>
</div>

<div class="container">

<div class="stats">

<div class="card">
<h3>25</h3>
<p>Orders</p>
</div>

<div class="card">
<h3>12</h3>
<p>Wishlist</p>
</div>

<div class="card">
<h3>₹1500</h3>
<p>Rewards</p>
</div>

</div>

<div class="menu">

<div class="menu-item">📦 My Orders</div>

<div class="menu-item">❤️ Wishlist</div>

<div class="menu-item">💳 Payments</div>

<div class="menu-item">📍 Saved Addresses</div>

<div class="menu-item">🎁 Coupons & Rewards</div>

<div class="menu-item">⭐ Myntra Insider</div>

<div class="menu-item">🔔 Notifications</div>

<div class="menu-item">⚙️ Account Settings</div>

<div class="menu-item">🚪 Logout</div>

</div>

</div>

</body>
</html>
