<!DOCTYPE html>
<html>
<head>
<title>Premium Profile</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

.profile{
    width:80%;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    text-align:center;
}

.profile img{
    width:120px;
    border-radius:50%;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-top:30px;
}

.box{
    background:#fff;
    padding:20px;
    width:150px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.box h2{
    color:#ff3f6c;
}
</style>

</head>
<body>

<div class="profile">
    <img src="https://i.pravatar.cc/150">
    <h1>Santhu Kumar</h1>
    <p>⭐ Premium Member</p>

    <div class="stats">
        <div class="box">
            <h2>25</h2>
            <p>Orders</p>
        </div>

        <div class="box">
            <h2>12</h2>
            <p>Wishlist</p>
        </div>

        <div class="box">
            <h2>2450</h2>
            <p>Points</p>
        </div>

        <div class="box">
            <h2>3</h2>
            <p>Address</p>
        </div>
    </div>
</div>

</body>
</html>
