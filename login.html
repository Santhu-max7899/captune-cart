<!DOCTYPE html>
<html>
<head>
<title>Captune Cart Login</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0B0B0B;
font-family:Arial,sans-serif;
}

.box{
width:400px;
background:#1A1A1A;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px rgba(212,175,55,.4);
}

h1{
color:#D4AF37;
}

input{
width:90%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:90%;
padding:15px;
background:#D4AF37;
color:black;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">
<h1>CAPTUNE CART</h1>
<p style="color:white;">Luxury Shopping Experience</p>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button>Sign In</button>
</div>

</body>
</html><!DOCTYPE html></html>
