<!DOCTYPE html>
<html>
<head>
<title>Captune Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#111;
    color:white;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:#000;
}

.logo{
    color:#FFD700;
    font-size:40px;
    font-weight:bold;
}

.menu a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-size:18px;
}

.menu a:hover{
    color:#FFD700;
}

.search-bar{
    width:70%;
    margin:30px auto;
    display:flex;
}

.search-bar input{
    flex:1;
    padding:15px;
    border:none;
    outline:none;
    border-radius:10px 0 0 10px;
    font-size:16px;
}

.search-bar button{
    background:#FFD700;
    color:black;
    border:none;
    padding:15px 25px;
    font-weight:bold;
    cursor:pointer;
    border-radius:0 10px 10px 0;
}

.banner{
    width:90%;
    margin:20px auto;
    padding:35px;
    text-align:center;
    background:linear-gradient(135deg,#FFD700,#ff9800);
    color:black;
    border-radius:20px;
    font-size:30px;
    font-weight:bold;
}

.products{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:50px;
    flex-wrap:wrap;
}

.card{
    background:#222;
    width:280px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card h2{
    margin:15px 0;
}

.price{
    color:#FFD700;
    font-size:22px;
    margin:10px 0;
}

.card button{
    background:#FFD700;
    color:black;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.footer{
    text-align:center;
    padding:20px;
    margin-top:40px;
    background:#000;
}

</style>
</head>

<body>

<nav>
    <div class="logo">👑 Captune Cart</div>

    <div class="menu">
        <a href="#">Home</a>
        <a href="login.html">Login</a>
        <a href="cart.html">Cart</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<div class="search-bar">
    <input type="text" placeholder="Search products, brands and more...">
    <button>🔍 Search</button>
</div>

<div class="banner">
    🎉 Mega Sale - Up To 70% OFF
</div>

<div class="products">

    <div class="card">
        <h1>⌚</h1>
        <h2>Smart Watch</h2>
        <div class="price">₹2999</div>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <h1>🎧</h1>
        <h2>Headphones</h2>
        <div class="price">₹1999</div>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <h1>👟</h1>
        <h2>Shoes</h2>
        <div class="price">₹3499</div>
        <button>Add to Cart</button>
    </div>

</div>

<div class="footer">
    © 2026 Captune Cart | Premium Shopping Experience
</div>

</body>
</html>
