<!DOCTYPE html>
<html>
<head>
    <title>Captune Cart</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#111;
            color:white;
        }

        nav{
            background:black;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            color:red;
            font-size:40px;
            font-weight:bold;
        }

        .menu a{
            color:white;
            text-decoration:none;
            margin-left:25px;
            font-size:20px;
        }

        .search-bar{
            width:60%;
            margin:30px auto;
            display:flex;
        }

        .search-bar input{
            flex:1;
            padding:15px;
            border:none;
            outline:none;
            border-radius:10px 0 0 10px;
        }

        .search-bar button{
            padding:15px 25px;
            background:red;
            color:white;
            border:none;
            border-radius:0 10px 10px 0;
            cursor:pointer;
        }

        .products{
            display:flex;
            justify-content:center;
            gap:30px;
            margin-top:50px;
        }

        .card{
            background:#222;
            padding:40px;
            border-radius:15px;
            text-align:center;
            width:250px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Captune Cart</div>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Login</a>
        <a href="#">Cart</a>
        <a href="#">Profile</a>
    </div>
</nav>

<div class="search-bar">
    <input type="text" placeholder="Search products...">
    <button>🔍 Search</button>
</div>

<div class="products">

    <div class="card">
        <h2>⌚ Smart Watch</h2>
        <br>
        <p>₹2999</p>
    </div>

    <div class="card">
        <h2>🎧 Headphones</h2>
        <br>
        <p>₹1999</p>
    </div>

    <div class="card">
        <h2>👟 Shoes</h2>
        <br>
        <p>₹3499</p>
    </div>

</div>

</body>
</html>
