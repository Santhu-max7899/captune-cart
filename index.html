
<!DOCTYPE html>
<html>
<head>
<title>Captune Cart</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#141414;
color:white;
}

header{
background:black;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:32px;
font-weight:bold;
color:#E50914;
}

.hero{
text-align:center;
padding:100px 20px;
}

.hero h1{
font-size:50px;
}

.btn{
background:#E50914;
color:white;
padding:12px 25px;
border:none;
border-radius:5px;
cursor:pointer;
}

.products{
display:flex;
justify-content:center;
gap:20px;
padding:40px;
}

.card{
background:#222;
padding:20px;
border-radius:10px;
width:220px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

footer{
background:black;
padding:20px;
text-align:center;
}
</style>
</head>

<body>

<header>
<div class="logo">CAPTUNE CART</div>
<div>🛒 Cart</div>
</header>

<section class="hero">
<h1>🔥 Mega Sale 50% OFF 🔥</h1>
<p>Shop Smart, Live Better</p>
<button class="btn">Shop Now</button>
</section>

<section class="products">

<div class="card">
<h3>⌚ Smart Watch</h3>
<p>₹2,999</p>
<button class="btn">Buy Now</button>
</div>

<div class="card">
<h3>🎧 Headphones</h3>
<p>₹1,999</p>
<button class="btn">Buy Now</button>
</div>

<div class="card">
<h3>👟 Shoes</h3>
<p>₹3,499</p>
<button class="btn">Buy Now</button>
</div>

</section>

<footer>
<p>Email: santhoshj7899@gmail.com</p>
<p>Phone: +91 7899435068</p>
</footer>

</body>
</html>
